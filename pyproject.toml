[project]
name = "project-message"
version = "0.1.0"
description = "WhatsApp Cloud API webhook agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "pydantic-ai>=2.37.0",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/project_message"]
