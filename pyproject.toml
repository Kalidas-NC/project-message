[project]
name = "project-message"
version = "0.1.0"
description = "Local WhatsApp-like agent mock"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "streamlit>=1.62.0",
    "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/project_message"]
